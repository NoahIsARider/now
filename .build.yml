# builds.sr.ht: rebuild and republish the site on every push.
# The oauth directive grants a short-lived pages.sr.ht token to the build, so no
# secret is stored anywhere in this repository.
image: alpine/edge
oauth: pages.sr.ht/PAGES:RW
packages:
  - python3
  - curl
  - tar
environment:
  site: noahisarider.srht.site
  subdir: MAYDAY
tasks:
  - build: |
      python3 build.py
  - verify: |
      test -f site/index.html
      test -f site/film/first-cow/index.html
      echo "site/ has $(find site -type f | wc -l) files"
  - package: |
      cd site
      tar -czf ../site.tar.gz .
  - publish: |
      curl -fsS -H "Authorization: Bearer $OAUTH2_TOKEN" \
        -F content=@site.tar.gz \
        "https://pages.sr.ht/publish/$site/$subdir"
      echo
      echo "published -> https://$site/$subdir/"
